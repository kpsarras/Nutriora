name: Nutriora local Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nutriora-local-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Check .NET SDK
        shell: pwsh
        run: dotnet --info

      - name: Restore
        shell: pwsh
        run: dotnet restore Nutriora.App/Nutriora.App.csproj

      - name: Build
        shell: pwsh
        run: dotnet build Nutriora.App/Nutriora.App.csproj -c Release --no-restore

      - name: Publish to local disk
        shell: pwsh
        run: |
          $destination = 'D:\NutrioraBuilds\latest'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          dotnet publish Nutriora.App/Nutriora.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Local build saved to $destination"
