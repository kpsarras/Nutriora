name: Nutriora local Windows build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-build.yml'
      - 'BUILD_TRIGGER.txt'
  workflow_dispatch:
concurrency:
  group: nutriora-local-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Verify local SDK and drive
        shell: powershell
        run: |
          dotnet --info
          if (!(Test-Path 'D:\')) { throw 'Drive D: is unavailable on this runner.' }
      - name: Restore and build
        shell: powershell
        run: |
          dotnet restore src/Nutriora.App/Nutriora.App.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/Nutriora.App/Nutriora.App.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish locally with fallback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'D:\WindowsProjects\Nutriora'
          $primary = Join-Path $root 'LatestBuild'
          $fallback = Join-Path $root 'LatestBuild-Ready'
          $installer = Join-Path $root 'LatestInstaller'
          $stage = Join-Path $env:RUNNER_TEMP 'nutriora-publish'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          dotnet publish src/Nutriora.App/Nutriora.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path (Join-Path $stage 'Nutriora.exe'))) { throw 'Nutriora.exe missing from publish output.' }
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          New-Item -ItemType Directory -Path $installer -Force | Out-Null
          function Install-Build([string]$destination) {
            $incoming = "$destination.incoming"
            $backup = "$destination.previous"
            if (Test-Path $incoming) { Remove-Item $incoming -Recurse -Force }
            New-Item -ItemType Directory -Path $incoming -Force | Out-Null
            Copy-Item -Path (Join-Path $stage '*') -Destination $incoming -Recurse -Force
            if (!(Test-Path (Join-Path $incoming 'Nutriora.exe'))) { throw 'Incomplete staged build.' }
            if (Test-Path $backup) { Remove-Item $backup -Recurse -Force }
            $hadOld = Test-Path $destination
            if ($hadOld) { Move-Item -Path $destination -Destination $backup -ErrorAction Stop }
            try {
              Move-Item -Path $incoming -Destination $destination -ErrorAction Stop
            } catch {
              if ($hadOld -and (Test-Path $backup) -and !(Test-Path $destination)) {
                Move-Item -Path $backup -Destination $destination
              }
              throw
            }
            if (Test-Path $backup) {
              try { Remove-Item $backup -Recurse -Force } catch { Write-Warning "Backup retained: $backup" }
            }
          }
          $destination = $primary
          try {
            Install-Build $primary
          } catch {
            Write-Warning "Primary folder unavailable: $($_.Exception.Message)"
            $destination = $fallback
            Install-Build $fallback
          }
          Write-Host "SUCCESS: Nutriora saved to $destination"
          Write-Host "Installer folder: $installer (installer not implemented)"
